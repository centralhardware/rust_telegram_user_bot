name: Build and Publish Docker image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "migrations/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ "**" ]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "migrations/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write
  pull-requests: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A push to main that is a PR's head tree unchanged, with that head's
      # build already green, was tested there: skip the checks, keep the image.
      - name: Already tested in a PR?
        id: tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
          [[ -n "$head" ]] || { echo "No merged PR for this commit"; exit 0; }
          ours=$(git rev-parse 'HEAD^{tree}')
          theirs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha)
          [[ "$ours" == "$theirs" ]] || { echo "Tree differs from PR head $head"; exit 0; }
          ok=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=build" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [[ "$ok" -gt 0 ]]; then
            echo "PR head $head passed with the same tree, skipping checks"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR head $head has no green build"
          fi

      - name: Set up Rust
        if: steps.tested.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        if: steps.tested.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: steps.tested.outputs.skip != 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.tested.outputs.skip != 'true'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        if: steps.tested.outputs.skip != 'true'
        run: cargo test --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        if: github.event_name != 'pull_request'
        id: meta
        shell: bash
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO_LOWER}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          TAGS="${IMAGE}:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build image on PRs (no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Trigger Coolify deployment
        if: github.event_name != 'pull_request'
        env:
          COOLIFY_DEPLOY_HOOK_URL: ${{ secrets.COOLIFY_DEPLOY_HOOK_URL }}
          COOLIFY_DEPLOY_BEARER_TOKEN: ${{ secrets.COOLIFY_DEPLOY_BEARER_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$COOLIFY_DEPLOY_HOOK_URL" ]]; then
            echo "Coolify deploy hook URL is not set. Skip Coolify deploy. Provide secrets.COOLIFY_DEPLOY_HOOK_URL to enable."
            exit 0
          fi
          echo "Triggering Coolify deployment via webhook..."
          AUTH_HEADER=()
          if [[ -n "$COOLIFY_DEPLOY_BEARER_TOKEN" ]]; then
            echo "Using Bearer authorization for Coolify trigger."
            AUTH_HEADER=(-H "Authorization: Bearer $COOLIFY_DEPLOY_BEARER_TOKEN")
          fi
          http_code=$(curl -fsS -o /tmp/coolify_resp.txt -w "%{http_code}" -X POST "${AUTH_HEADER[@]}" "$COOLIFY_DEPLOY_HOOK_URL") || true
          echo "Coolify response (HTTP $http_code):"
          cat /tmp/coolify_resp.txt || true
          if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
            echo "Coolify deploy trigger succeeded."
            exit 0
          else
            echo "Coolify deploy trigger failed with HTTP $http_code" >&2
            exit 1
          fi
